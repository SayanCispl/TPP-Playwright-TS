name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    env:
      CI: 'true'
      MOCK_API: 'false'
      TEST_EMAIL: 'sayan.koley@codeclouds.co.in'
      BASE_URL: 'https://the-pharmacy-place.webflow.io'
      CHECKOUT_TEST_PARAM: 'sandbox'
      VIDEO_PATH: 'fixtures/test_video.mp4'
      PHOTO_PATH: 'fixtures/test_photo.png'
      WORKERS: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers & system dependencies
        run: npx playwright install --with-deps chromium

      - name: TypeScript validation
        run: npm run typecheck

      - name: Run Playwright Smoke tests in Headed Mode with Xvfb (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test tests/smoke --project=chromium --headed --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1

      - name: Upload shard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shardIndex }}-results
          path: |
            reports/
            test-results/
          retention-days: 14

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [playwright-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge HTML Report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Unified HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: playwright-report
          retention-days: 14
